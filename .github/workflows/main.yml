name: Deploy React Vite to GitHub Pages

on:
  push:
    branches:
      - production  # Trigger saat ada push di branch production

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout kode
      - uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️⃣ Install dependencies
      - run: npm ci

      # 4️⃣ Build project
      - run: npm run build

      # 5️⃣ Deploy ke GitHub Pages
      - uses: peaceiris/actions-gh-pages@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: production  # branch yang live
          force_orphan: true
